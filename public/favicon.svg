<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A sheet of paper with a list on it, one thing crossed off. The cook book
       has the steaming pot; this is its companion, drawn in the same weight and
       the same slate so the two sit together on a home screen. -->
  <rect width="64" height="64" rx="12" fill="#FAF8F3"/>
  <g fill="none" stroke="#AEBDCA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- the sheet -->
    <path d="M17 12h30a2 2 0 0 1 2 2v36a2 2 0 0 1-2 2H17a2 2 0 0 1-2-2V14a2 2 0 0 1 2-2Z"/>
  </g>
  <g fill="none" stroke="#46607A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- three things, the first of them got -->
    <path d="M21.5 24.5l2.4 2.4 4.6-5"/>
    <path d="M21.5 34.5h4"/>
    <path d="M34 34.5h9.5"/>
    <path d="M21.5 43.5h4"/>
    <path d="M34 43.5h9.5"/>
  </g>
  <!-- the one already in the basket, crossed off: grey on its own rather than
       a grey line laid over a blue one, which came out muddy at 192px -->
  <path d="M34 25.5h9.5" stroke="#A49A90" stroke-width="2.6" stroke-linecap="round" fill="none"/>
</svg>
